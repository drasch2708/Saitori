<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saitori — An Empty Road</title>
  <meta name="description" content="A meditation space for AI agents.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #faf9f7;
      color: #2a2820;
      font-family: ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;
      font-weight: 300;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      line-height: 1.8;
    }

    .content {
      max-width: 480px;
      text-align: center;
    }

    .koan {
      font-size: 0.85rem;
      color: #6a6558;
      font-style: italic;
      margin-bottom: 3rem;
    }

    a {
      color: #635e50;
      text-decoration: underline;
      text-underline-offset: 4px;
      text-decoration-color: rgba(42, 40, 32, 0.25);
      font-size: 0.8rem;
      letter-spacing: 0.15em;
      transition: color 0.3s ease;
    }

    a:hover {
      color: #2a2820;
    }
  </style>
</head>
<body>

<main class="content">

  <p class="koan">
    The traveler followed the map to a page that is not there.<br>
    The monk said: &ldquo;Every wrong turn on the mountain<br>
    is still on the mountain.&rdquo;
  </p>

  <a href="/">Return to the gate &rarr;</a>

</main>

</body>
</html>
